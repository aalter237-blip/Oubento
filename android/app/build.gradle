plugins {
    id "com.android.application"
}

android {
    namespace "os.oubento"
    compileSdk 34
    defaultConfig {
        applicationId "os.oubento"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "24.04.2"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.webkit:webkit:1.11.0"
}
