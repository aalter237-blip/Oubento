name: Android Virtual Environment & Tailscale

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'مدة تشغيل بيئة الأندرويد بالساعات (1 إلى 6)'
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '6'

jobs:
  android-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install KVM & Android SDK Tools
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils \
            cpu-checker unzip wget curl adb socat xvfb x11vnc

          sudo kvm-ok || true
          sudo usermod -aG kvm $USER || true

          mkdir -p ~/android-sdk/cmdline-tools
          cd ~/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest

          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH

          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "emulator" "platforms;android-34" "system-images;android-34;google_apis;x86_64"

          echo "no" | avdmanager create avd -n android34 -k "system-images;android-34;google_apis;x86_64" --device "pixel_6" --force

      - name: Start Android Emulator & ADB Forward
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH

          nohup emulator -avd android34 -no-audio -no-window -gpu swiftshader_indirect -grpc-use-jwt 2>&1 > ~/emulator.log &

          echo "جاري انتظار إقلاع نظام الأندرويد..."
          adb wait-for-device
          while [ "$(adb shell getprop sys.boot_completed 2>/dev/null)" != "1" ]; do
            sleep 3
          done
          echo "تم إقلاع نظام الأندرويد بنجاح!"

          adb tcpip 5555
          nohup socat TCP-LISTEN:5555,bind=0.0.0.0,fork TCP:127.0.0.1:5555 >/dev/null 2>&1 &

      - name: Install & Connect Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="${TS_AUTHKEY}" --hostname=gh-android-vm
          sleep 3
          IP=$(tailscale ip -4)
          echo "========================================="
          echo "Android Tailscale IP : $IP"
          echo "ADB Port             : 5555"
          echo "Connect Command      : adb connect $IP:5555"
          echo "========================================="

      - name: Keep Session Alive (Timed)
        run: |
          HOURS=${{ github.event.inputs.duration_hours }}
          SECONDS_TO_RUN=$((HOURS * 3600))
          echo "بيئة الأندرويد ستعمل لمدة $HOURS ساعات..."
          sleep $SECONDS_TO_RUN
